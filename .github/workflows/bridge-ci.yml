name: Bridge CI

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'engine/bridge/**'
      - 'protocol/**'
      - 'tests/**'
      - '.github/workflows/bridge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'engine/bridge/**'
      - 'protocol/**'
      - 'tests/**'
      - '.github/workflows/bridge-ci.yml'

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
