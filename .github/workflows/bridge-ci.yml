name: Bridge CI

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'engine/bridge/**'
      - 'engine/host/**'
      - 'engine/upstream/patches/**'
      - 'tools/bootstrap-angband.sh'
      - 'protocol/**'
      - 'tests/**'
      - '.github/workflows/bridge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'engine/bridge/**'
      - 'protocol/**'
      - 'tests/**'
      - '.github/workflows/bridge-ci.yml'

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  upstream-adapter-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout pinned Angband 4.2.6 source
        uses: actions/checkout@v4
        with:
          repository: angband/angband
          ref: f3082213b73f3e463e3d0d60bff4b00462beae6e
          path: engine/upstream/angband
      - name: Apply pinned Angband frontend patch
        run: |
          git -C engine/upstream/angband apply --check "$GITHUB_WORKSPACE/engine/upstream/patches/angband-4.2.6-abfp.patch"
          git -C engine/upstream/angband apply "$GITHUB_WORKSPACE/engine/upstream/patches/angband-4.2.6-abfp.patch"
      - name: Configure bridge with real upstream headers
        run: >-
          cmake -S . -B build-upstream
          -DBUILD_TESTING=OFF
          -DABFP_WITH_ANGBAND=ON
          -DANGBAND_SRC_DIR=${{ github.workspace }}/engine/upstream/angband/src
      - name: Compile bridge and upstream adapter
        run: cmake --build build-upstream --target abfp_bridge --parallel
